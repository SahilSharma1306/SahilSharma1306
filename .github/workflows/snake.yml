# Snake Animation GitHub Action
# 
# This workflow generates the snake contribution graph animation
# for your GitHub profile. Add this file to your SahilSharma1306/SahilSharma1306
# repo at: .github/workflows/snake.yml
#
# It runs daily and generates SVG animations of your contribution graph.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: SahilSharma1306
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
